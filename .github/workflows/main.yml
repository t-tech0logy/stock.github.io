name: Refresh stock data

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Optional ticker to add or refresh, for example AMD. Leave blank to refresh everything."
        required: false
        type: string
  schedule:
    # 23:30 UTC is after the regular US market close in both EST and EDT.
    - cron: "30 23 * * 1-5"

concurrency:
  group: refresh-stock-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download SEC fundamentals and price history
        env:
          # Set a repository variable named SEC_CONTACT_EMAIL later if you want to use your own contact.
          SEC_USER_AGENT: "PlainStock educational dashboard ${{ vars.SEC_CONTACT_EMAIL || 'contact@example.com' }}"
          REQUESTED_SYMBOL: "${{ inputs.symbol }}"
        run: |
          if [ -n "$REQUESTED_SYMBOL" ]; then
            node scripts/update-data.mjs "$REQUESTED_SYMBOL"
          else
            node scripts/update-data.mjs
          fi

      - name: Save refreshed JSON files
        env:
          REQUESTED_SYMBOL: "${{ inputs.symbol }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks.js data/
          if git diff --cached --quiet; then
            echo "No data changes to save."
          else
            if [ -n "$REQUESTED_SYMBOL" ]; then
              git commit -m "data: add or refresh ${REQUESTED_SYMBOL^^}"
            else
              git commit -m "chore: refresh stock data"
            fi
            git push
          fi
